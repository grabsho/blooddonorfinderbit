<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donor Finder - Register Donor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
    <header>
        <nav class="navbar">
            <div class="logo">Blood Donor Finder</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="find-donor.html">Find Donor</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="emergency.html">Emergency</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
  <section class="form-section">
    <h2>Register as Blood Donor</h2>
    <p class="form-intro">Fill the form below to become a donor. We'll verify and add you to the directory.</p>
    
    <form id="register-form" class="donor-form">
      <div class="form-row">
        <div class="form-group">
          <label for="donor-name">Full Name *</label>
          <input type="text" id="donor-name" name="name" placeholder="Your full name" required>
          <span id="donor-name-msg" class="field-msg"></span>
        </div>
        <div class="form-group">
          <label for="donor-age">Age *</label>
          <input type="number" id="donor-age" name="age" placeholder="18-65" min="18" max="65" required>
          <span id="donor-age-msg" class="field-msg"></span>
        </div>
      </div>
      <div class="form-group">
        <label>Blood Group *</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="bloodGroup" value="A+"> A+</label>
          <label class="radio-label"><input type="radio" name="bloodGroup" value="A-"> A-</label>
          <label class="radio-label"><input type="radio" name="bloodGroup" value="B+"> B+</label>
          <label class="radio-label"><input type="radio" name="bloodGroup" value="B-"> B-</label>
          <label class="radio-label"><input type="radio" name="bloodGroup" value="AB+"> AB+</label>
          <label class="radio-label"><input type="radio" name="bloodGroup" value="AB-"> AB-</label>
          <label class="radio-label"><input type="radio" name="bloodGroup" value="O+"> O+</label>
          <label class="radio-label"><input type="radio" name="bloodGroup" value="O-"> O-</label>
        </div>
        <span id="donor-blood-msg" class="field-msg"></span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="donor-state">State *</label>
          <select id="donor-state" name="state" required>
            <option value="">Select State</option>
          </select>
          <span id="donor-state-msg" class="field-msg"></span>
        </div>
        <div class="form-group">
          <label for="donor-district">District *</label>
          <select id="donor-district" name="district" required disabled>
            <option value="">Select State First</option>
          </select>
          <span id="donor-district-msg" class="field-msg"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="donor-phone">Phone Number *</label>
        <div class="phone-input-group">
          <span class="phone-prefix">+91</span>
          <input type="tel" id="donor-phone" name="phone" placeholder="10-digit number" maxlength="10" required>
        </div>
        <span id="donor-phone-msg" class="field-msg"></span>
      </div>
      <button type="submit" class="btn btn-primary">Register as Donor</button>
      <p id="register-message" class="form-message"></p>
    </form>
  </section>
</main>

    <footer>
        <p>&copy; 2026 Blood Donor Finder | College Mini Project</p>
    </footer>

    <script src="js/script.js" defer></script>
</body>
</html>
